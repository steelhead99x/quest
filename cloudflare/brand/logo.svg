<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-labelledby="t">
	<title id="t">Kixel Quest</title>
	<!-- Hand-written. Kixel's mark, a K of amber cells on graphite, with the cell that ends
	     the K's leg drawn as Quest's commit node: the plan's next step is a commit. -->
	<rect width="144" height="144" rx="32" fill="#07090d"/>
	<g fill="#ffb020"><rect x="28" y="28" width="28" height="28" rx="5"/><rect x="92" y="28" width="28" height="28" rx="5"/><rect x="28" y="60" width="28" height="28" rx="5"/><rect x="60" y="60" width="28" height="28" rx="5"/><rect x="28" y="92" width="28" height="28" rx="5"/></g>
	<circle cx="106" cy="106" r="10.5" fill="none" stroke="#ffb020" stroke-width="7"/>
</svg>
