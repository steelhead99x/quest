<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title">
	<title id="title">Quest: a quest log for your repo and your agents</title>
	<!-- The quest log site's social image, hand-written. Colours are moq-dev's slate and ink with
	     Quest's amber markers and size colours; type is Atkinson Hyperlegible Next, read from
	     node_modules. Export: see cloudflare/brand/README.md. -->
	<style>
		@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 200 800;
			src: url("../../node_modules/@fontsource-variable/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2") format("woff2-variations"); }
		text { font-family: "Atkinson Hyperlegible Next", sans-serif; }
		.head { font-weight: 800; letter-spacing: -1.9px; fill: #eef2f8; }
		.sub { font-weight: 400; fill: #8c99b0; }
		.title { font-weight: 700; fill: #eef2f8; }
		.meta { font-weight: 600; }
	</style>
	<defs>
		<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
			<path d="M48 0 H0 V48" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
		</pattern>
		<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<mask id="grid-fade"><rect width="1280" height="640" fill="url(#fade)"/></mask>
		<radialGradient id="glow" cx="0.08" cy="0" r="0.6">
			<stop offset="0" stop-color="#22c55e" stop-opacity="0.12"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
		</radialGradient>
		<g id="bang" fill="currentColor" stroke="#131d33" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke">
			<path d="M-7 -19 H7 L3.5 4 H-3.5 Z"/><rect x="-5" y="8.5" width="10" height="10" rx="2"/>
		</g>
		<g id="query" stroke-linecap="round" stroke-linejoin="round">
			<path d="M-8 -9 C-8 -21 8 -21 8 -9 C8 -1 0 -1 0 5" fill="none" stroke="#131d33" stroke-width="9.5"/>
			<path d="M-8 -9 C-8 -21 8 -21 8 -9 C8 -1 0 -1 0 5" fill="none" stroke="currentColor" stroke-width="5"/>
			<rect x="-5" y="8.5" width="10" height="10" rx="2" fill="currentColor" stroke="#131d33" stroke-width="2.4" paint-order="stroke"/>
		</g>
	</defs>

	<rect width="1280" height="640" fill="#0f172a"/>
	<rect width="1280" height="640" fill="url(#grid)" mask="url(#grid-fade)"/>
	<rect width="1280" height="640" fill="url(#glow)"/>

	<!-- Mark: a copy of design/theme/logo.svg -->
	<g transform="translate(80 64) scale(1.25)">
		<rect x="2" y="2" width="60" height="60" rx="15" fill="#ffc53d"/>
		<path d="M25.5 13.5 a3 3 0 0 1 3 -3 h7 a3 3 0 0 1 3 3 L35.6 37 a2 2 0 0 1 -2 1.8 h-3.2 a2 2 0 0 1 -2 -1.8 Z" fill="#0f172a"/>
		<circle cx="32" cy="48" r="5.5" fill="none" stroke="#0f172a" stroke-width="4.5"/>
	</g>
	<text x="176" y="128" class="head" font-size="52" letter-spacing="-1px">Quest</text>

	<text x="78" y="262" class="head" font-size="84">A quest log for your repo</text>
	<text x="78" y="354" class="head" font-size="84">and your agents</text>
	<text x="80" y="414" class="sub" font-size="30">Readable plans. Explicit dependencies. Reviewable Git changes.</text>

	<!-- A ready quest unblocking a blocked one, joined like commits; and one in review. -->
	<g transform="translate(80 466)">
		<rect width="352" height="104" rx="8" fill="#131d33" stroke="#1f2a42"/>
		<rect x="0" y="0" width="3" height="104" fill="#4ade80"/>
		<use href="#bang" x="32" y="42" color="#ffc53d"/>
		<text x="56" y="47" class="title" font-size="24">Add the CSV endpoint</text>
		<rect x="56" y="64" width="34" height="24" rx="4" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.55"/>
		<text x="73" y="82" class="meta" font-size="16" text-anchor="middle" fill="#4ade80">S</text>
		<text x="102" y="82" class="meta" font-size="19" fill="#ffc53d">Ready</text>
	</g>
	<path d="M432 518 H464" stroke="#ffc53d" stroke-opacity="0.6" stroke-width="2.5"/>
	<g transform="translate(464 466)">
		<rect width="352" height="104" rx="8" fill="#131d33" stroke="#1f2a42"/>
		<rect x="0" y="0" width="3" height="104" fill="#4da3ff"/>
		<use href="#bang" x="32" y="42" color="#9ba5b4"/>
		<text x="56" y="47" class="title" font-size="24" fill="#8c99b0" style="fill:#8c99b0">Add a download button</text>
		<rect x="56" y="64" width="34" height="24" rx="4" fill="#4da3ff" fill-opacity="0.14" stroke="#4da3ff" stroke-opacity="0.55"/>
		<text x="73" y="82" class="meta" font-size="16" text-anchor="middle" fill="#4da3ff">M</text>
		<text x="102" y="82" class="meta" font-size="19" fill="#9ba5b4">Blocked</text>
	</g>
	<g transform="translate(848 466)">
		<rect width="352" height="104" rx="8" fill="#131d33" stroke="#1f2a42"/>
		<rect x="0" y="0" width="3" height="104" fill="#b98cff"/>
		<use href="#query" x="32" y="42" color="#ffc53d"/>
		<text x="56" y="47" class="title" font-size="24">Build the quest board</text>
		<rect x="56" y="64" width="34" height="24" rx="4" fill="#b98cff" fill-opacity="0.14" stroke="#b98cff" stroke-opacity="0.55"/>
		<text x="73" y="82" class="meta" font-size="16" text-anchor="middle" fill="#b98cff">L</text>
		<text x="102" y="82" class="meta" font-size="19" fill="#ffc53d">In review</text>
	</g>
</svg>
