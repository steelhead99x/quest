name: Check

# Runs after each push to main. In kixel-ai/quest the merge queue already runs
# `just check`, `just test`, and the flake check on the host's runner; this
# repeats them on a hosted one and adds the installed lifecycle on Linux and
# macOS. A newer push cancels an older run, even one in progress, so runs
# coalesce.
#
# A fork has no merge queue and no host runner, so queue.yml never builds its
# pull requests. There `check` also runs on each pull request to main, as the
# fork's pre-merge build; kixel-ai/quest's pull requests keep only the skipped
# `Queue` context queue-pr.yml reports.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.repository != 'kixel-ai/quest'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      # The full history holds the merge base with the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: nix develop --command just install
      # `quest worktree run` owns processes through a systemd user scope, which the tests exercise.
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Check
        run: nix develop --command just check
      - name: Test
        run: nix develop --command just test
      - name: Check Nix package
        run: nix flake check

  lifecycle:
    name: lifecycle (${{ matrix.runner }})
    # After each push only: the macOS runner is often slow to start.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: Install the checkout with the flake's source build
        run: nix build --out-link "$RUNNER_TEMP/quest-lifecycle-install" .#quest
      - name: Verify the installed CLI lifecycle
        shell: bash
        # A flake build reports its commit, as Nix abbreviates it.
        run: nix develop --command bash scripts/lifecycle-check.sh "$RUNNER_TEMP/quest-lifecycle-install/bin/quest" "${GITHUB_SHA::7}"
      # Work outside the job holds a fresh macOS runner's load above its CPUs.
      - name: Check that the gate admits and owns its command's descendants
        shell: bash
        run: bash scripts/gate-check.sh "$RUNNER_TEMP/quest-lifecycle-install/bin/quest"
