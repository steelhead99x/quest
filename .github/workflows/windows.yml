name: Windows

# The native Windows suite, quest.toml's nightly `windows` task, runs nightly on
# main through platform.yml, outside pull requests and the merge queue, so a
# Windows regression may land and the next run catches it. GitHub reports a
# failed scheduled run only to the account that last changed the cron schedule
# (with Actions notifications on), not to the repository's watchers; that is
# the maintainer, whose account lands the workflow.
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repository's own copy, so a change to it runs here first.
  x64:
    uses: ./.github/workflows/platform.yml # zizmor: ignore[self-repository] actionlint 1.7.12 cannot read `$/`.
    with:
      tier: nightly
      os: '["windows"]'
      timeout-minutes: 20
  arm64:
    uses: ./.github/workflows/platform.yml # zizmor: ignore[self-repository] actionlint 1.7.12 cannot read `$/`.
    with:
      tier: nightly
      os: '["windows"]'
      windows-runner: windows-11-arm
      timeout-minutes: 20
